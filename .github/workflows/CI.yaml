# ---------------------------------------------------------------------------
# Saucia v2 — Continuous Integration
#
# Required status checks (set in branch protection, see "Branch protection"):
#   - architecture       pnpm arch  (dependency-cruiser + Steiger, same rules as local)
#   - verify             lint, type-check, test, build
#   - secret-scan
#   - dependency-review  (pull requests only)
#
# No step uses continue-on-error. Architecture violations fail the pipeline
# exactly as they do locally.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs opt in when they need more.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  CI: 'true'

jobs:
  # -------------------------------------------------------------------------
  # Architecture: runs first and fails fast. Installs only what pnpm arch needs.
  # Required check name: "architecture".
  # -------------------------------------------------------------------------
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs dependency-cruiser (server, client, packages) then Steiger (customer FSD).
      # Same command as local development.
      - name: Architecture boundaries
        run: pnpm arch

  # -------------------------------------------------------------------------
  # Main verification. Starts only after architecture passes.
  # Required check name: "verify".
  # -------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: architecture

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint (eslint + boundaries)
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Upload only from main so PRs do not fill Actions storage.
      - name: Upload client build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: apps/customer-web/dist
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # Secret scanning (bible P0.7: .env hygiene).
  # Required check name: "secret-scan".
  # -------------------------------------------------------------------------
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for organisation-owned repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # -------------------------------------------------------------------------
  # Dependency review (pull requests only).
  # Required check name: "dependency-review".
  # -------------------------------------------------------------------------
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD