# ---------------------------------------------------------------------------
# Saucia v2 — Continuous Integration

# Runs on every PR and every push to main. The same workflow runs on main so
# that the merge commit is verified with the same matrix as the PR.

# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; individual jobs opt in when they need more.
permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  CI: 'true'

jobs:
  # -------------------------------------------------------------------------
  # Main verification: lint, type-check, test, architecture, build.
  # One job (not four) because Turborepo parallelises across the workspace
  # itself, and a single install keeps CI minutes and cache churn low.
  # -------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history helps turbo's --filter=...[origin/main] when we add it.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # setup-node manages the pnpm store cache keyed on pnpm-lock.yaml.
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile is the CI contract: no silent dep bumps.
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # ---- Static checks ---------------------------------------------------

      - name: Lint (eslint + boundaries)
        run: pnpm lint

      - name: Type-check (tsc across the workspace)
        run: pnpm type-check

      # ---- Architecture ----------------------------------------------------
      # `pnpm arch` runs:
      #   - dependency-cruiser over apps/customer-web/src, apps/server/src, packages
      #   - steiger over apps/customer-web/src (FSD structure)
      # These are the rules from sections 3.1 and 3.2 of the plan.
      - name: Architecture boundaries (depcruise + steiger)
        run: pnpm arch

      # ---- Tests -----------------------------------------------------------

      - name: Test (vitest across the workspace)
        run: pnpm test

      # ---- Build -----------------------------------------------------------

      - name: Build (turbo run build)
        run: pnpm build

      # ---- Artifacts -------------------------------------------------------
      # Only upload on main so PRs do not litter the Actions storage.
      - name: Upload client build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: apps/customer-web/dist
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Secret scanning: the plan calls out `.env` hygiene as a Phase 0 concern.
  # Gitleaks scans the diff on PRs and the full history on main.
  # -------------------------------------------------------------------------
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # Dependency review: block PRs that add a vulnerable or disallowed licence
  # dependency. Cheap to run and only meaningful on PRs.
  # -------------------------------------------------------------------------
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Allow licences common in this stack; adjust when a new one appears.
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD